# Edibel — nginx sunucu bloğu (bkz. CLAUDE.md, Bölüm 13).
#
# Kurulum: bu dosya sunucuda /etc/nginx/sites-available/ altına kopyalanır
# ve sites-enabled içine sembolik bağ verilir. TLS sertifikası Certbot ile
# alındıktan SONRA etkinleştirilmelidir; sertifika alma adımları
# deploy/README.md içindedir.
#
# Tarayıcı kamerası yalnızca güvenli bağlamda çalıştığı için TLS zorunludur.

server {
    listen 80;
    listen [::]:80;
    server_name edibel.talhaonur.com;

    # Certbot webroot doğrulaması (yenilemede de kullanılır)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name edibel.talhaonur.com;

    # Certbot tarafından oluşturulan yollar
    ssl_certificate     /etc/letsencrypt/live/edibel.talhaonur.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edibel.talhaonur.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Görüntüler tarayıcıda küçültülüyor; 10 MB rahat bir üst sınırdır
    client_max_body_size 10m;

    # Güvenlik başlıkları. Kamera aynı köken için açık kalmalıdır, aksi
    # halde canlı kamera yolu (getUserMedia) çalışmaz.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/edibel.access.log;
    error_log  /var/log/nginx/edibel.error.log;

    location / {
        # Uygulama kapsayıcısı yalnızca yerel arayüze bağlıdır
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Model çağrısı uzun sürebilir
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;

        # Yanıtı tamponlamadan ilet (uzun süren analiz isteği için)
        proxy_buffering off;
    }
}

# Not: Hız sınırlaması uygulama içinde yapılır (cihaz başına dakikada en
# fazla on tarama). nginx tarafında ek bir sınır istenirse http bloğunda
# limit_req_zone tanımlanıp burada limit_req ile kullanılabilir.
